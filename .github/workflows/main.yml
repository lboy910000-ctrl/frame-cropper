name: Build app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name FrameCropper frame_cropper.py
          mkdir release
          move dist\FrameCropper.exe release\FrameCropper-Windows.exe

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --name FrameCropper frame_cropper.py
          mkdir release
          mv dist/FrameCropper release/FrameCropper-Linux

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name FrameCropper frame_cropper.py
          mkdir release
          cd dist && zip -r ../release/FrameCropper-macOS.zip FrameCropper.app

      - uses: actions/upload-artifact@v4
        with:
          name: FrameCropper-${{ runner.os }}
          path: release/*

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
